services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
      POSTGRES_DB: bifrost
    ports:
      - "5433:5432"
    volumes:
      - bifrost-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: 
      - "6379:6379"

volumes:
  bifrost-postgres-data:
